<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12302C">
<title>Pañol · UNRaf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   PAÑOL — App de alumnos y docentes (mobile first)
   Se reserva una FRANJA (fecha + hora + 1 a 4 h) y se recibe un
   código de 6 dígitos. El retiro y la devolución se hacen frente
   a la puerta, escaneando su QR (ver /locker/A-01).
   ============================================================ */
:root{
  --esmalte-osc:#12302C; --esmalte:#1F4C46; --esmalte-cl:#2A5D56;
  --papel:#EDEFE7; --papel-suave:#A9C2BB; --linea:#3B665F;
  --ambar:#E8A317; --ambar-osc:#B87D0A;
  --verde:#2F9E68; --cian:#2E8FB5; --alarma:#D9564B;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Archivo',system-ui,sans-serif;background:var(--esmalte-osc);color:var(--papel);
  display:flex;flex-direction:column;font-size:15px;line-height:1.45;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;
  background:repeating-linear-gradient(180deg,rgba(255,255,255,.022) 0 2px,transparent 2px 9px)}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.pantalla{flex:1;display:none;flex-direction:column;padding:22px 20px 30px;max-width:560px;width:100%;margin:0 auto;position:relative;z-index:1}
.pantalla[data-activa="1"]{display:flex}

/* ---------- Encabezado ---------- */
.cabecera{display:flex;align-items:center;justify-content:space-between;padding-bottom:18px}
.logo{font-weight:800;font-size:15px;letter-spacing:-.01em}
.logo span{display:block;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--papel-suave);font-weight:500}
.salir{background:none;border:1px solid var(--linea);color:var(--papel-suave);font-family:inherit;font-size:12px;padding:6px 12px;border-radius:3px;cursor:pointer}

/* ---------- Acceso ---------- */
.acceso-titulo{font-size:29px;font-weight:800;letter-spacing:-.025em;line-height:1.08;margin-top:7vh}
.acceso-bajada{color:var(--papel-suave);font-size:14.5px;margin:10px 0 30px;max-width:34ch}
.campo{margin-bottom:16px}
.campo label,.rotulo{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--papel-suave);font-weight:600;margin-bottom:7px}
.campo input,.campo select{width:100%;font-family:'IBM Plex Mono',monospace;font-size:20px;letter-spacing:.12em;
  padding:15px 16px;border-radius:4px;border:1px solid var(--linea);background:#0E2724;color:var(--papel)}
.campo select{font-size:17px;letter-spacing:.04em;appearance:none}
.campo input:focus,.campo select:focus{outline:2px solid var(--ambar);outline-offset:1px;border-color:transparent}
.principal{width:100%;padding:17px;font-family:inherit;font-size:16px;font-weight:700;background:var(--ambar);color:#20140A;
  border:none;border-radius:4px;cursor:pointer;box-shadow:0 3px 0 var(--ambar-osc)}
.principal:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ambar-osc)}
.principal:disabled{background:#4E6F68;color:#8FA9A2;box-shadow:0 3px 0 #33534D;cursor:not-allowed}
.borde{width:100%;margin-top:12px;padding:13px;font-family:inherit;font-size:14.5px;font-weight:700;background:none;
  border:1.5px solid var(--ambar);color:var(--ambar);border-radius:4px;cursor:pointer;text-align:center;text-decoration:none;display:block}
.borde.tenue{border-color:var(--linea);color:var(--papel-suave);font-weight:600}
.borde.peligro{border-color:#B9574D;color:#F0A79F}
.error{color:#F0A79F;font-size:13.5px;margin-top:14px;min-height:20px}
.pie{margin-top:auto;padding-top:26px;font-size:12px;color:#5B7F77;line-height:1.6}

/* ---------- Avisos ---------- */
.banda{border-radius:6px;padding:13px 15px;font-size:13.5px;line-height:1.5;margin-bottom:16px}
.banda b{display:block;font-size:14.5px;margin-bottom:2px}
.banda.roja{background:#3A1E1B;border:1px solid #7C2A22;color:#F6C2BC}
.banda.ambar{background:#2E2A16;border:1px solid #6B5A21;color:#F2DDA6}
.banda.info{background:#173B37;border:1px solid var(--linea);color:var(--papel-suave)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:40;
  width:min(92vw,520px);background:#F2F3EC;color:#14231F;border-radius:6px;padding:13px 15px;font-size:14px;
  box-shadow:0 14px 40px -10px rgba(0,0,0,.7);display:none;border-left:4px solid var(--ambar)}
.toast[data-visible="1"]{display:block}
.toast[data-nivel="critica"]{border-left-color:var(--alarma)}

/* ---------- Solapas ---------- */
.solapas{display:flex;gap:6px;background:#0E2724;padding:4px;border-radius:5px;margin-bottom:20px}
.solapa{flex:1;padding:11px 8px;border:none;background:none;color:var(--papel-suave);font-family:inherit;font-size:13.5px;
  font-weight:600;border-radius:3px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px}
.solapa[aria-selected="true"]{background:var(--esmalte);color:var(--papel)}
.globo{background:var(--ambar);color:#20140A;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;padding:1px 7px;border-radius:9px}

/* ---------- Selector de franja ---------- */
.franja{background:#0E2724;border:1px solid var(--linea);border-radius:7px;padding:16px;margin-bottom:18px}
.dias{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none}
.dia{flex:none;min-width:58px;padding:8px 6px;border-radius:5px;border:1px solid var(--linea);background:none;color:var(--papel);
  font-family:inherit;cursor:pointer;text-align:center;line-height:1.15}
.dia small{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--papel-suave)}
.dia b{font-family:'IBM Plex Mono',monospace;font-size:16px;font-weight:600}
.dia[aria-pressed="true"]{background:var(--ambar);color:#20140A;border-color:var(--ambar)}
.dia[aria-pressed="true"] small{color:#5A3D05}
.fila-franja{display:grid;grid-template-columns:1fr 1.25fr;gap:12px;align-items:end}
.fila-franja .campo{margin:0}
.fila-franja select{padding:12px;font-size:17px}
.duraciones{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.duracion{padding:12px 0;border-radius:4px;border:1px solid var(--linea);background:none;color:var(--papel);
  font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:600;cursor:pointer}
.duracion[aria-pressed="true"]{background:var(--ambar);color:#20140A;border-color:var(--ambar)}
.duracion:disabled{opacity:.3;cursor:not-allowed}
.resumen-franja{margin-top:13px;font-size:12.5px;color:var(--papel-suave);line-height:1.55}
.resumen-franja b{color:var(--papel)}

/* ---------- Tarjeta de material ---------- */
.lista{display:flex;flex-direction:column;gap:14px}
.material{background:linear-gradient(160deg,var(--esmalte-cl),var(--esmalte) 55%,#193F3A);border-radius:7px;padding:18px;
  box-shadow:0 8px 22px -16px #000,inset 0 1px 0 rgba(255,255,255,.08)}
.material[data-agotado="1"]{background:#1A302D;box-shadow:none}
.material-fila{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
.material h3{font-size:17px;font-weight:700;letter-spacing:-.01em}
.material .categoria{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--papel-suave);font-weight:600;margin-bottom:5px}
.placa{background:var(--papel);color:#16302C;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:14px;padding:4px 10px;
  border-radius:2px;flex:none;box-shadow:inset 0 -1px 0 rgba(0,0,0,.22)}
.stock{margin-top:16px}
.stock-numeros{display:flex;justify-content:space-between;align-items:baseline;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--papel-suave)}
.stock-numeros b{font-size:22px;font-weight:600;color:var(--papel)}
.stock-barra{height:8px;background:rgba(0,0,0,.4);border-radius:4px;margin-top:8px;overflow:hidden;display:flex}
.stock-barra i{display:block;height:100%;background:var(--verde);transition:width .5s ease}
.stock-barra i.ocupado{background:rgba(255,255,255,.14)}
.material[data-agotado="1"] .stock-barra i:first-child{background:var(--alarma)}
.aviso-stock{font-size:12px;margin-top:9px;color:var(--ambar)}
.material[data-agotado="1"] .aviso-stock{color:#F0A79F}
.pedido{display:flex;gap:10px;margin-top:16px;align-items:stretch}
.contador{display:flex;align-items:center;background:#0E2724;border:1px solid var(--linea);border-radius:4px;flex:none}
.contador button{width:42px;background:none;border:none;color:var(--papel);font-size:22px;font-family:inherit;cursor:pointer;line-height:1;padding:0}
.contador button:disabled{color:#4E6F68;cursor:not-allowed}
.contador input{width:46px;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:17px;font-weight:600;background:none;border:none;color:var(--papel)}
.pedido .principal{flex:1;padding:13px;font-size:14.5px}
.nota-aprobacion{font-size:12px;color:var(--papel-suave);margin-top:9px}
.nota-aprobacion[data-requiere="1"]{color:var(--ambar)}

/* ---------- Reserva ---------- */
.reserva{background:#173B37;border:1px solid var(--linea);border-radius:8px;padding:18px;position:relative;overflow:hidden}
.reserva[data-estado="PENDIENTE_APROBACION"]{background:#2E2A16;border-color:#6B5A21}
.reserva[data-estado="PENDIENTE_APROBACION"]::after{content:"";position:absolute;left:0;bottom:0;height:2px;width:40%;
  background:var(--ambar);animation:recorrer 1.8s ease-in-out infinite}
@keyframes recorrer{0%{left:-40%}100%{left:100%}}
.reserva[data-estado="EN_MORA"]{border-color:#8A4038;background:#2E211F}
.reserva-cabeza{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.reserva h3{font-size:17px;font-weight:700}
.chip{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:2px;
  background:rgba(255,255,255,.1);color:var(--papel);margin-bottom:7px}
.chip[data-estado="RESERVADO"]{background:var(--ambar);color:#20140A}
.chip[data-estado="EN_USO"]{background:var(--cian);color:#fff}
.chip[data-estado="EN_MORA"]{background:var(--alarma);color:#fff}
.chip[data-estado="BUFFER_30_MIN"],.chip[data-estado="FINALIZADO"]{background:var(--verde);color:#fff}
.chip[data-estado="PENDIENTE_AUDITORIA"]{background:#6B5A21;color:#F2DDA6}
.meta{font-size:13px;color:var(--papel-suave);margin-top:6px;line-height:1.55}
.meta b{color:var(--papel)}
.codigo-caja{margin-top:15px;background:var(--papel);color:#14231F;border-radius:5px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.codigo-caja small{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#5A6660;font-weight:700;display:block}
.codigo-caja .codigo{font-family:'IBM Plex Mono',monospace;font-size:32px;font-weight:600;letter-spacing:.18em;line-height:1.1}
.pasos{margin-top:14px;padding-left:18px;font-size:13px;color:var(--papel-suave);line-height:1.65}
.pasos b{color:var(--papel)}

/* ---------- Historial ---------- */
.historial-titulo{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--papel-suave);font-weight:600;margin:26px 0 10px}
.cerrado{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid #1F423D;font-size:13.5px}
.cerrado:last-child{border-bottom:none}
.cerrado .fechas{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--papel-suave);text-align:right;flex:none}
.cerrado small{color:var(--papel-suave)}
.vacio-caja{background:rgba(255,255,255,.04);border:1px dashed var(--linea);border-radius:6px;padding:26px 20px;text-align:center}
.vacio-caja h2{font-size:17px;margin-bottom:7px}
.vacio-caja p{font-size:13.5px;color:var(--papel-suave);line-height:1.55}

/* ---------- Confirmación ---------- */
.overlay{position:fixed;inset:0;background:rgba(10,28,25,.95);z-index:30;display:none;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center}
.overlay[data-visible="1"]{display:flex}
.overlay h2{font-size:23px;font-weight:800;letter-spacing:-.015em}
.overlay p{font-size:14.5px;color:var(--papel-suave);margin-top:9px;max-width:34ch;line-height:1.55}
.overlay .codigo-caja{width:min(86vw,320px);margin-top:20px;justify-content:center;flex-direction:column}
.overlay .codigo-caja .codigo{font-size:42px}
.overlay .principal{max-width:320px;margin-top:22px}
.sello{width:74px;height:74px;border-radius:50%;display:grid;place-items:center;font-size:34px;font-weight:800;margin-bottom:18px;
  background:radial-gradient(circle at 34% 28%,#5FD199,var(--verde) 55%,#1E7049);color:#06301D;box-shadow:0 6px 0 #14563A}
.sello.espera{background:radial-gradient(circle at 34% 28%,#F6C24E,var(--ambar) 55%,var(--ambar-osc));color:#20140A;box-shadow:0 6px 0 #8A5D07;animation:respirar 2s ease-in-out infinite}
@keyframes respirar{50%{transform:scale(.94)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- ============ 1. ACCESO ============ -->
<section class="pantalla" id="pantallaAcceso" data-activa="1">
  <div class="cabecera"><div class="logo">UNRaf<span>Pañol</span></div></div>
  <h1 class="acceso-titulo">Reservá material del pañol,<br>retiralo con un código.</h1>
  <p class="acceso-bajada">Entrá con tu legajo y el PIN que te dieron en Alumnado.</p>
  <form id="formAcceso">
    <div class="campo"><label for="legajo">Legajo</label>
      <input id="legajo" inputmode="numeric" autocomplete="username" placeholder="10234" required></div>
    <div class="campo"><label for="pin">PIN</label>
      <input id="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="current-password" placeholder="••••" required></div>
    <button class="principal" type="submit">Entrar</button>
    <p class="error" id="errorAcceso"></p>
  </form>
  <p class="pie">Universidad Nacional de Rafaela · Pañol automatizado — Ingeniería en Computación.</p>
</section>

<!-- ============ 2. APLICACIÓN ============ -->
<section class="pantalla" id="pantallaApp">
  <div class="cabecera">
    <div class="logo" id="saludo">Hola<span id="datosUsuario">—</span></div>
    <button class="salir" id="btnSalir">Salir</button>
  </div>

  <div class="banda roja" id="bandaSancion" hidden></div>

  <div class="solapas" role="tablist">
    <button class="solapa" id="tabReservar" role="tab" aria-selected="true">Reservar</button>
    <button class="solapa" id="tabReservas" role="tab" aria-selected="false">Mis reservas <span class="globo" id="globo" hidden>0</span></button>
  </div>

  <!-- ---- Reservar ---- -->
  <div id="vistaReservar">
    <div class="banda ambar" id="bandaVigente" hidden></div>
    <div class="banda info" id="bandaReglas"></div>

    <div class="franja" id="franja">
      <span class="rotulo">Fecha</span>
      <div class="dias" id="dias"></div>
      <div class="fila-franja">
        <div class="campo"><label for="hora">Hora de inicio</label><select id="hora"></select></div>
        <div><span class="rotulo">Duración</span>
          <div class="duraciones" id="duraciones">
            <button class="duracion" data-h="1" aria-pressed="true">1 h</button>
            <button class="duracion" data-h="2" aria-pressed="false">2 h</button>
            <button class="duracion" data-h="3" aria-pressed="false">3 h</button>
            <button class="duracion" data-h="4" aria-pressed="false">4 h</button>
          </div>
        </div>
      </div>
      <p class="resumen-franja" id="resumenFranja"></p>
    </div>

    <div class="lista" id="listaCatalogo"></div>
  </div>

  <!-- ---- Mis reservas ---- -->
  <div id="vistaReservas" hidden>
    <div class="lista" id="listaVigentes"></div>
    <div id="bloqueHistorial" hidden>
      <p class="historial-titulo">Historial</p>
      <div id="listaHistorial"></div>
    </div>
  </div>
</section>

<!-- ============ Confirmación de reserva ============ -->
<div class="overlay" id="overlay">
  <div class="sello" id="overlaySello">✓</div>
  <h2 id="overlayTitulo">Reserva confirmada</h2>
  <p id="overlayTexto"></p>
  <div class="codigo-caja" id="overlayCodigo" hidden><small>Código de operación</small><span class="codigo" id="overlayCodigoValor"></span></div>
  <button class="principal" id="overlayCerrar">Ver mis reservas</button>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
/* ============================================================
   CLIENTE — alumnos y docentes

   RESERVA: se elige fecha, hora de inicio y duración (1 a 4 h). El
   catálogo muestra lo disponible EN ESA FRANJA (el stock se bloquea por
   unidades y por horario, no por locker). Alumno: 1 unidad, solo hoy,
   siempre con aprobación. Docente: hasta 7 días, aprobación solo si pide
   más del 50% de la capacidad.

   RETIRO y DEVOLUCIÓN: frente a la puerta, escaneando su QR e
   ingresando el código (pantalla /locker/A-01). La devolución también se
   puede iniciar desde acá ("Iniciar devolución").

   Todo lo que se valida acá se vuelve a validar en el servidor.
   ============================================================ */
const API = location.origin + '/api';

const estado = {
  token: null, usuario: null, reglas: null,
  // reloj del servidor: la franja se arma con SU hora, no con la del celular
  minutosServidor: 0, fechaServidor: null, t0: 0,
  fecha: null, hora: null, duracion: 1,
  catalogo: [], vigentes: [], historial: [], cantidades: {},
  esperandoAprobacion: null,
  ws: null,
};

const $ = (id) => document.getElementById(id);
const DIAS = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
const ETIQUETAS = {
  PENDIENTE_APROBACION: 'En revisión', RESERVADO: 'Reservado', EN_USO: 'En uso', EN_MORA: 'En mora',
  BUFFER_30_MIN: 'Devuelto', PENDIENTE_AUDITORIA: 'Devuelto · en verificación', FINALIZADO: 'Finalizado',
  RECHAZADO: 'Rechazado', CANCELADO_NO_SHOW: 'No retirado', CANCELADO: 'Cancelado',
};

async function api(ruta, opciones = {}) {
  const respuesta = await fetch(API + ruta, {
    ...opciones,
    headers: { 'Content-Type': 'application/json', ...(estado.token ? { Authorization: `Bearer ${estado.token}` } : {}) },
  });
  const datos = await respuesta.json().catch(() => ({}));
  if (respuesta.status === 401 && estado.token) { location.reload(); throw new Error('Sesión vencida'); }
  if (!respuesta.ok) throw new Error(datos.error || `Error ${respuesta.status}`);
  return datos;
}

/* ---------- Tiempo ---------- */
const aMin = (hhmm) => { const [h, m] = hhmm.split(':').map(Number); return h * 60 + m; };
const aHora = (min) => `${String(Math.floor(min / 60)).padStart(2, '0')}:${String(min % 60).padStart(2, '0')}`;
const sumarDias = (fecha, n) => { const d = new Date(`${fecha}T12:00:00Z`); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const nombreDia = (fecha) => DIAS[new Date(`${fecha}T12:00:00Z`).getUTCDay()];
const fechaCorta = (fecha) => `${nombreDia(fecha)} ${fecha.slice(8, 10)}/${fecha.slice(5, 7)}`;
const minutosAhora = () => estado.minutosServidor + Math.floor((Date.now() - estado.t0) / 60000);
const esHoy = (fecha) => fecha === estado.fechaServidor;
const textoFecha = (fecha) => (esHoy(fecha) ? 'hoy' : fecha === sumarDias(estado.fechaServidor, 1) ? 'mañana' : `el ${fechaCorta(fecha)}`);
const fechaHora = (iso) => iso ? new Date(iso).toLocaleString('es-AR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false }) : '—';

function sincronizarReloj(reglas) {
  estado.reglas = reglas;
  estado.fechaServidor = reglas.hoy;
  estado.minutosServidor = aMin(reglas.ahora);
  estado.t0 = Date.now();
}

/* ---------- Acceso ---------- */
$('formAcceso').addEventListener('submit', async (e) => {
  e.preventDefault();
  $('errorAcceso').textContent = '';
  try {
    const datos = await api('/auth/usuario/login', {
      method: 'POST', body: JSON.stringify({ legajo: $('legajo').value.trim(), pin: $('pin').value.trim() }),
    });
    estado.token = datos.token;
    estado.usuario = datos.usuario;
    sincronizarReloj(datos.reglas);
    entrar();
  } catch (error) {
    $('errorAcceso').textContent = error instanceof TypeError ? 'No hay conexión con el servidor del pañol.' : error.message;
  }
});
$('btnSalir').addEventListener('click', () => location.reload());

async function entrar() {
  $('saludo').firstChild.textContent = `Hola, ${estado.usuario.nombre.split(',').pop().trim()}`;
  $('datosUsuario').textContent = `Legajo ${estado.usuario.legajo} · ${estado.usuario.rol}`;
  $('pantallaAcceso').dataset.activa = '0';
  $('pantallaApp').dataset.activa = '1';
  $('bandaReglas').innerHTML = `<b>Tus reglas como ${estado.usuario.rol}</b>${estado.reglas.descripcion}.`;
  estado.fecha = estado.fechaServidor;
  pintarSancion();
  armarDias();
  armarHoras();
  await Promise.all([cargarReservas(), cargarCatalogo()]);
  conectarWebSocket();
  setInterval(() => { armarHoras(true); pintarReservas(); }, 30000);
}

function pintarSancion() {
  const u = estado.usuario;
  $('bandaSancion').hidden = !u.sancionado;
  $('bandaSancion').innerHTML = u.sancionado
    ? `<b>Legajo sancionado</b>${u.motivoSancion || ''}. No podés hacer reservas nuevas hasta que la Mesa de Alumnado lo rehabilite. Sí podés devolver.`
    : '';
}

/* ---------- Solapas ---------- */
$('tabReservar').addEventListener('click', () => cambiarSolapa('reservar'));
$('tabReservas').addEventListener('click', () => cambiarSolapa('reservas'));
function cambiarSolapa(cual) {
  const reservar = cual === 'reservar';
  $('tabReservar').setAttribute('aria-selected', String(reservar));
  $('tabReservas').setAttribute('aria-selected', String(!reservar));
  $('vistaReservar').hidden = !reservar;
  $('vistaReservas').hidden = reservar;
}

/* ---------- Franja ---------- */
function armarDias() {
  const cuantos = estado.usuario.rol === 'docente' ? estado.reglas.diasAnticipacion + 1 : 1;
  $('dias').innerHTML = Array.from({ length: cuantos }, (_, i) => {
    const fecha = sumarDias(estado.fechaServidor, i);
    return `<button class="dia" data-fecha="${fecha}" aria-pressed="${fecha === estado.fecha}">
      <small>${i === 0 ? 'Hoy' : i === 1 ? 'Mañana' : nombreDia(fecha)}</small><b>${fecha.slice(8, 10)}/${fecha.slice(5, 7)}</b></button>`;
  }).join('');
}
$('dias').addEventListener('click', (e) => {
  const boton = e.target.closest('.dia');
  if (!boton) return;
  estado.fecha = boton.dataset.fecha;
  document.querySelectorAll('.dia').forEach((b) => b.setAttribute('aria-pressed', String(b === boton)));
  armarHoras();
  cargarCatalogo();
});

/** Horas de inicio posibles: pasos de 15 min, dentro del horario, sin franjas pasadas. */
function armarHoras(conservar = false) {
  const r = estado.reglas;
  const apertura = aMin(r.horarioApertura);
  const cierre = aMin(r.horarioCierre);
  // Una franja que empezó sigue disponible mientras dure la tolerancia de retiro.
  const desde = esHoy(estado.fecha)
    ? Math.max(apertura, Math.ceil((minutosAhora() - r.toleranciaRetiroMin + 1) / r.pasoFranjaMin) * r.pasoFranjaMin)
    : apertura;
  const opciones = [];
  for (let m = desde; m + 60 <= cierre; m += r.pasoFranjaMin) opciones.push(aHora(m));

  const anterior = conservar ? estado.hora : null;
  $('hora').innerHTML = opciones.length
    ? opciones.map((h) => `<option value="${h}">${h} hs</option>`).join('')
    : '<option value="">Sin franjas hoy</option>';
  estado.hora = opciones.includes(anterior) ? anterior : opciones[0] || null;
  if (estado.hora) $('hora').value = estado.hora;
  armarDuraciones();
  // La franja elegida ya pasó mientras la pantalla estaba abierta: se recarga.
  if (conservar && estado.hora !== anterior) cargarCatalogo();
}
$('hora').addEventListener('change', () => { estado.hora = $('hora').value; armarDuraciones(); cargarCatalogo(); });

function armarDuraciones() {
  const cierre = aMin(estado.reglas.horarioCierre);
  const inicio = estado.hora ? aMin(estado.hora) : cierre;
  document.querySelectorAll('.duracion').forEach((b) => {
    b.disabled = inicio + Number(b.dataset.h) * 60 > cierre;
  });
  if (inicio + estado.duracion * 60 > cierre) estado.duracion = Math.max(1, Math.floor((cierre - inicio) / 60));
  document.querySelectorAll('.duracion').forEach((b) => b.setAttribute('aria-pressed', String(Number(b.dataset.h) === estado.duracion)));
  pintarResumenFranja();
}
$('duraciones').addEventListener('click', (e) => {
  const boton = e.target.closest('.duracion');
  if (!boton || boton.disabled) return;
  estado.duracion = Number(boton.dataset.h);
  armarDuraciones();
  cargarCatalogo();
});

function pintarResumenFranja(franja) {
  if (!estado.hora) { $('resumenFranja').textContent = 'No quedan franjas para esta fecha.'; return; }
  const inicio = aMin(estado.hora);
  const r = estado.reglas;
  const limite = aHora(inicio + estado.duracion * 60);
  $('resumenFranja').innerHTML =
    `Retirás ${textoFecha(estado.fecha)} entre las <b>${estado.hora}</b> y las <b>${aHora(inicio + r.toleranciaRetiroMin)}</b> · ` +
    `devolvés antes de las <b>${limite}</b>.` +
    (franja?.error ? `<br><span style="color:#F0A79F">${franja.error}</span>` : '');
}

/* ---------- Datos ---------- */
let pidiendo = 0;
async function cargarCatalogo() {
  if (!estado.hora) { estado.catalogo = []; dibujarCatalogo(); return; }
  const turno = ++pidiendo;
  try {
    const datos = await api(`/usuario/catalogo?fecha=${estado.fecha}&hora=${estado.hora}&duracion=${estado.duracion}`);
    if (turno !== pidiendo) return;   // llegó tarde: el usuario ya cambió la franja
    sincronizarReloj(datos.reglas);
    estado.catalogo = datos.items;
    pintarResumenFranja(datos.franja);
    dibujarCatalogo(datos.franja);
  } catch (error) {
    $('listaCatalogo').innerHTML = `<div class="vacio-caja"><p>${error.message}</p></div>`;
  }
}

async function cargarReservas() {
  try {
    const datos = await api('/usuario/reservas');
    estado.vigentes = datos.vigentes;
    estado.historial = datos.historial;
    pintarReservas();
  } catch { /* el catálogo ya avisa si no hay conexión */ }
}

async function refrescarPerfil() {
  try {
    const datos = await api('/usuario/perfil');
    estado.usuario = datos.usuario;
    pintarSancion();
    dibujarCatalogo();
  } catch { /* reintenta con el próximo evento */ }
}

let demora = null;
const pronto = (fn) => { clearTimeout(demora); demora = setTimeout(fn, 400); };

function conectarWebSocket() {
  const ws = new WebSocket(`${location.origin.replace(/^http/, 'ws')}/ws?token=${estado.token}`);
  estado.ws = ws;
  ws.onmessage = (mensaje) => {
    const { evento, datos } = JSON.parse(mensaje.data);
    if (evento === 'prestamo.actualizado') { alCambiarPrestamo(datos); cargarReservas(); pronto(cargarCatalogo); }
    if (evento === 'locker.actualizado') pronto(cargarCatalogo);
    if (evento === 'usuario.actualizado') refrescarPerfil();
    if (evento === 'alerta') mostrarToast(datos.mensaje, datos.nivel);
  };
  ws.onclose = () => setTimeout(conectarWebSocket, 4000);
}

/* ---------- Catálogo ---------- */
function dibujarCatalogo(franja) {
  const contenedor = $('listaCatalogo');
  const vigente = estado.vigentes.find((p) => ['PENDIENTE_APROBACION', 'RESERVADO', 'EN_USO', 'EN_MORA'].includes(p.estado));
  const bloqueado = estado.usuario.sancionado || Boolean(vigente);

  $('bandaVigente').hidden = !vigente;
  if (vigente) {
    $('bandaVigente').innerHTML = estado.usuario.rol === 'docente'
      ? `<b>Ya tenés una reserva activa</b>Se habilita una nueva cuando la concretes (la devuelvas) o la canceles.`
      : `<b>Ya tenés un préstamo activo</b>Podés tener uno a la vez. Revisalo en "Mis reservas".`;
  }

  if (!estado.catalogo.length) {
    contenedor.innerHTML = '<div class="vacio-caja"><h2>Sin franja elegida</h2><p>Elegí una fecha y una hora para ver qué hay disponible.</p></div>';
    return;
  }

  contenedor.innerHTML = '';
  const esDocente = estado.usuario.rol === 'docente';
  for (const item of estado.catalogo) {
    const disponible = item.disponible ?? 0;
    const agotado = !item.sePuedePedir;
    const elegida = Math.min(estado.cantidades[item.lockerId] || 1, Math.max(1, item.maximo));
    estado.cantidades[item.lockerId] = elegida;
    const pct = (n) => (item.stock ? (n / item.stock) * 100 : 0);

    const tarjeta = document.createElement('article');
    tarjeta.className = 'material';
    tarjeta.dataset.agotado = agotado ? '1' : '0';
    tarjeta.innerHTML = `
      <div class="material-fila">
        <div><div class="categoria">${item.categoria}</div><h3>${item.descripcionItem}</h3></div>
        <span class="placa">${item.lockerId}</span>
      </div>
      <div class="stock">
        <div class="stock-numeros">
          <span><b>${item.disponible ?? '—'}</b> de ${item.stock} libres en la franja</span>
          <span>cap. ${item.capacidadMaxima}</span>
        </div>
        <div class="stock-barra"><i style="width:${pct(disponible)}%"></i><i class="ocupado" style="width:${pct(item.stock - disponible)}%"></i></div>
        ${item.fueraDeServicio ? '<p class="aviso-stock">Locker fuera de servicio</p>'
          : item.disponible === 0 ? '<p class="aviso-stock">Sin unidades libres en esa franja: probá otro horario</p>' : ''}
      </div>
      <div class="pedido">
        ${esDocente ? `<div class="contador">
          <button type="button" data-paso="-1" aria-label="Menos">−</button>
          <input data-cantidad inputmode="numeric" value="${elegida}" aria-label="Cantidad">
          <button type="button" data-paso="1" aria-label="Más">+</button></div>` : ''}
        <button class="principal" data-pedir></button>
      </div>
      <p class="nota-aprobacion" data-nota></p>`;

    const boton = tarjeta.querySelector('[data-pedir]');
    const nota = tarjeta.querySelector('[data-nota]');
    const entrada = tarjeta.querySelector('[data-cantidad]');

    const actualizar = () => {
      const cantidad = estado.cantidades[item.lockerId];
      const requiere = !esDocente || cantidad > item.capacidadMaxima / 2;
      boton.disabled = agotado || bloqueado;
      boton.textContent = agotado ? 'No disponible' : requiere ? 'Solicitar a Alumnado' : 'Reservar';
      nota.dataset.requiere = requiere ? '1' : '0';
      nota.textContent = agotado ? '' : esDocente
        ? (requiere
            ? `Más del 50% de la capacidad (${item.umbralAprobacion}): la reserva pasa por la Mesa de Alumnado.`
            : `Hasta ${item.umbralAprobacion} unidades se reserva al instante.`)
        : 'Los alumnos reservan 1 unidad y siempre con aprobación de Alumnado.';
      if (entrada) entrada.value = cantidad;
    };
    const fijar = (valor) => {
      estado.cantidades[item.lockerId] = Math.min(Math.max(1, item.maximo), Math.max(1, Math.floor(Number(valor) || 1)));
      actualizar();
    };

    tarjeta.querySelectorAll('[data-paso]').forEach((b) => {
      b.disabled = agotado || bloqueado;
      b.addEventListener('click', () => fijar(estado.cantidades[item.lockerId] + Number(b.dataset.paso)));
    });
    entrada?.addEventListener('change', () => fijar(entrada.value));
    if (entrada) entrada.disabled = agotado || bloqueado;
    boton.addEventListener('click', () => reservar(item));
    actualizar();
    contenedor.appendChild(tarjeta);
  }
}

async function reservar(item) {
  const cantidad = estado.usuario.rol === 'docente' ? estado.cantidades[item.lockerId] : 1;
  try {
    const { prestamo } = await api('/usuario/reservas', {
      method: 'POST',
      body: JSON.stringify({ lockerId: item.lockerId, cantidad, fecha: estado.fecha, horaInicio: estado.hora, duracionHoras: estado.duracion }),
    });
    if (prestamo.estado === 'RESERVADO') mostrarReservado(prestamo);
    else {
      estado.esperandoAprobacion = prestamo.id;
      mostrarOverlay({
        espera: true,
        titulo: 'Solicitud enviada',
        texto: `${prestamo.cantidad} × ${prestamo.descripcionItem} · ${textoFecha(prestamo.fechaReserva)} ${prestamo.horaInicio}–${prestamo.horaLimite}. La Mesa de Alumnado tiene que aprobarla; cuando lo haga vas a ver tu código acá.`,
      });
    }
    await Promise.all([cargarReservas(), cargarCatalogo()]);
  } catch (error) {
    mostrarToast(error.message, 'critica');
    cargarCatalogo();
  }
}

/** Si Alumnado resolvió la solicitud que estaba esperando, se avisa en grande. */
function alCambiarPrestamo(p) {
  if (estado.esperandoAprobacion !== p.id || p.estado === 'PENDIENTE_APROBACION') return;
  estado.esperandoAprobacion = null;
  if (p.estado === 'RESERVADO') mostrarReservado(p, '¡Aprobada!');
  else mostrarOverlay({
    error: true,
    titulo: 'Solicitud rechazada',
    texto: p.motivoRechazo ? `Motivo: ${p.motivoRechazo}` : 'La Mesa de Alumnado no aprobó el pedido.',
  });
}

function mostrarReservado(p, titulo = 'Reserva confirmada') {
  mostrarOverlay({
    titulo,
    texto: `Presentate en el locker ${p.locker.id} ${textoFecha(p.fechaReserva)} entre las ${p.horaInicio} y las ${aHora(aMin(p.horaInicio) + estado.reglas.toleranciaRetiroMin)}. Escaneá el QR de la puerta e ingresá este código. Devolvé antes de las ${p.horaLimite}.`,
    codigo: p.codigoOperacion,
  });
}

/* ---------- Mis reservas ---------- */
function pintarReservas() {
  const abiertas = estado.vigentes;
  const activas = abiertas.filter((p) => ['PENDIENTE_APROBACION', 'RESERVADO', 'EN_USO', 'EN_MORA'].includes(p.estado)).length;
  $('globo').hidden = !activas;
  $('globo').textContent = activas;

  const lista = $('listaVigentes');
  if (!abiertas.length) {
    lista.innerHTML = '<div class="vacio-caja"><h2>No tenés reservas abiertas</h2><p>Elegí una franja en "Reservar". Tu código de operación va a aparecer acá.</p></div>';
  } else {
    lista.innerHTML = '';
    for (const p of abiertas) lista.appendChild(tarjetaReserva(p));
  }

  $('bloqueHistorial').hidden = !estado.historial.length;
  $('listaHistorial').innerHTML = estado.historial.map((p) => {
    const detalle = p.motivoRechazo ? ` · ${p.motivoRechazo}` : p.estado === 'FINALIZADO' && p.timestampDevolucion ? ` · devuelto ${fechaHora(p.timestampDevolucion)}` : '';
    return `<div class="cerrado"><span>${p.cantidad} × ${p.descripcionItem} <small>· ${p.locker.id}</small><br>
      <small>${ETIQUETAS[p.estado]}${detalle}</small></span>
      <span class="fechas">${fechaCorta(p.fechaReserva)}<br>${p.horaInicio}–${p.horaLimite}</span></div>`;
  }).join('');
  dibujarCatalogo();
}

function tarjetaReserva(p) {
  const tarjeta = document.createElement('article');
  tarjeta.className = 'reserva';
  tarjeta.dataset.estado = p.estado;
  const finRetiro = aHora(aMin(p.horaInicio) + estado.reglas.toleranciaRetiroMin);
  const codigo = p.codigoOperacion
    ? `<div class="codigo-caja"><div><small>Código de operación</small><span class="codigo">${p.codigoOperacion}</span></div><span class="placa">${p.locker.id}</span></div>`
    : '';

  let cuerpo = '';
  let acciones = '';
  switch (p.estado) {
    case 'PENDIENTE_APROBACION':
      cuerpo = `<p class="meta">Esperando aprobación de la Mesa de Alumnado (hace ${p.minutosEsperando ?? 0} min). Si no la aprueban antes de las ${finRetiro}, se cae sola.</p>`;
      acciones = '<button class="borde tenue" data-accion="cancelar">Cancelar solicitud</button>';
      break;
    case 'RESERVADO':
      cuerpo = p.requiereRespaldo
        ? `<div class="banda ambar" style="margin:14px 0 0"><b>Retirá en la ventanilla de Alumnado</b>El locker no tiene stock para tu turno (el anterior no devolvió). Te entregan material de respaldo.</div>`
        : `<ol class="pasos">
            <li>Andá al locker <b>${p.locker.id}</b> ${textoFecha(p.fechaReserva)} entre las <b>${p.horaInicio}</b> y las <b>${finRetiro}</b>.</li>
            <li>Escaneá el QR de la puerta e ingresá tu código.</li>
            <li>Cuando se destrabe (15 s), abrí, retirá ${p.cantidad} y cerrá hasta escuchar la traba.</li>
          </ol>${p.lockerOriginalId ? `<p class="meta">Reasignada desde ${p.lockerOriginalId}: usá el locker y el código de arriba.</p>` : ''}`;
      acciones = `${p.requiereRespaldo ? '' : `<a class="borde" href="/locker/${p.locker.id}">Abrir pantalla del locker ${p.locker.id}</a>`}
        <button class="borde tenue" data-accion="cancelar">Cancelar reserva</button>`;
      break;
    case 'EN_USO':
      cuerpo = `<p class="meta">Retirado ${fechaHora(p.timestampRetiro)}. Devolvé en el locker <b>${p.locker.id}</b> antes de las <b>${p.horaLimite}</b> (${restante(p.limite)}).</p>`;
      acciones = `<button class="borde" data-accion="devolver">Iniciar devolución</button>
        <button class="borde tenue" data-accion="reportar">Reportar faltante o daño</button>`;
      break;
    case 'EN_MORA':
      cuerpo = `<div class="banda roja" style="margin:14px 0 0"><b>En mora hace ${p.minutosDemora} min</b>La hora límite era las ${p.horaLimite}. Tu legajo quedó bloqueado para nuevas reservas hasta que Alumnado lo rehabilite. Devolvé cuanto antes.</div>`;
      acciones = '<button class="borde" data-accion="devolver">Iniciar devolución</button>';
      break;
    case 'BUFFER_30_MIN':
      cuerpo = `<p class="meta">Devuelto ${fechaHora(p.timestampDevolucion)}. ¡Gracias! Las unidades vuelven al stock en 30 minutos.</p>`;
      break;
    case 'PENDIENTE_AUDITORIA':
      cuerpo = `<p class="meta">Devuelto ${fechaHora(p.timestampDevolucion)}. La Mesa de Alumnado va a verificar el reingreso del material.</p>`;
      break;
  }

  tarjeta.innerHTML = `
    <div class="reserva-cabeza">
      <div><span class="chip" data-estado="${p.estado}">${ETIQUETAS[p.estado]}</span>
        <h3>${p.cantidad} × ${p.descripcionItem}</h3>
        <p class="meta">${fechaCorta(p.fechaReserva)} · <b>${p.horaInicio}–${p.horaLimite}</b> (${p.duracionHoras} h)</p></div>
      ${p.codigoOperacion ? '' : `<span class="placa">${p.locker.id}</span>`}
    </div>
    ${codigo}${cuerpo}${acciones}`;

  tarjeta.querySelector('[data-accion="cancelar"]')?.addEventListener('click', () => cancelar(p));
  tarjeta.querySelector('[data-accion="devolver"]')?.addEventListener('click', () => devolver(p));
  tarjeta.querySelector('[data-accion="reportar"]')?.addEventListener('click', () => reportar(p));
  return tarjeta;
}

function restante(iso) {
  const min = Math.round((Date.parse(iso) - Date.now()) / 60000);
  if (min <= 0) return 'ya venció';
  return min >= 60 ? `quedan ${Math.floor(min / 60)} h ${min % 60} min` : `quedan ${min} min`;
}

async function cancelar(p) {
  if (!confirm(`¿Cancelar la reserva de ${p.cantidad} × ${p.descripcionItem}?`)) return;
  try {
    await api(`/usuario/reservas/${p.id}/cancelar`, { method: 'POST' });
    mostrarToast('Reserva cancelada');
    await Promise.all([cargarReservas(), cargarCatalogo()]);
  } catch (error) { mostrarToast(error.message, 'critica'); }
}

/** "Iniciar devolución": arranca el pulso y lleva a la pantalla del locker. */
async function devolver(p) {
  if (!confirm(`¿Estás frente al locker ${p.locker.id}? Se va a destrabar la puerta durante 15 segundos.`)) return;
  try {
    const { token } = await api(`/usuario/reservas/${p.id}/devolucion`, { method: 'POST' });
    location.href = `/locker/${p.locker.id}#op=${token}`;
  } catch (error) { mostrarToast(error.message, 'critica'); }
}

async function reportar(p) {
  const detalle = prompt('Contá qué falta o qué está dañado. Alumnado recibe el aviso al instante.');
  if (!detalle) return;
  try {
    await api(`/usuario/reservas/${p.id}/incidencia`, { method: 'POST', body: JSON.stringify({ detalle }) });
    mostrarToast('Reporte enviado a la Mesa de Alumnado');
  } catch (error) { mostrarToast(error.message, 'critica'); }
}

/* ---------- Overlay y avisos ---------- */
function mostrarOverlay({ titulo, texto, codigo = null, espera = false, error = false }) {
  $('overlay').dataset.visible = '1';
  $('overlaySello').className = `sello${espera ? ' espera' : ''}`;
  $('overlaySello').textContent = espera ? '…' : error ? '×' : '✓';
  $('overlaySello').style.background = error ? 'radial-gradient(circle at 34% 28%,#EE8A80,#D9564B 55%,#9B342B)' : '';
  $('overlayTitulo').textContent = titulo;
  $('overlayTexto').textContent = texto;
  $('overlayCodigo').hidden = !codigo;
  $('overlayCodigoValor').textContent = codigo || '';
}
$('overlayCerrar').addEventListener('click', () => {
  $('overlay').dataset.visible = '0';
  cambiarSolapa('reservas');
});

let relojToast = null;
function mostrarToast(texto, nivel = 'info') {
  const toast = $('toast');
  toast.textContent = texto;
  toast.dataset.nivel = nivel;
  toast.dataset.visible = '1';
  clearTimeout(relojToast);
  relojToast = setTimeout(() => (toast.dataset.visible = '0'), nivel === 'critica' ? 9000 : 5000);
}
$('toast').addEventListener('click', () => ($('toast').dataset.visible = '0'));
</script>
