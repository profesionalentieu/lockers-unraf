<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12302C">
<title>Abrir casillero · Pañol UNRaf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   PÁGINA DEL QR — la abre alguien parado frente al locker
   Sin login: la persona ya está ahí, con el celular en la mano.
   Todo el diseño gira alrededor de una sola acción: 4 dígitos.
   Teclado propio en vez del teclado del sistema: menos toques,
   números grandes, y funciona igual con una mano ocupada.
   ============================================================ */
:root{
  --esmalte-osc:#12302C; --esmalte:#1F4C46; --esmalte-cl:#2A5D56;
  --papel:#EDEFE7; --papel-suave:#A9C2BB; --linea:#3B665F;
  --ambar:#E8A317; --ambar-osc:#B87D0A;
  --verde:#2F9E68; --alarma:#D9564B;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Archivo',system-ui,sans-serif;background:var(--esmalte-osc);color:var(--papel);
  display:flex;flex-direction:column;align-items:center;
  padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
  overflow-x:hidden;line-height:1.45;
}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;
  background:repeating-linear-gradient(180deg,rgba(255,255,255,.022) 0 2px,transparent 2px 9px)}
.hoja{width:100%;max-width:420px;display:flex;flex-direction:column;flex:1;
  position:relative;z-index:1;padding-bottom:20px}

/* ---------- Encabezado: qué locker es ---------- */
.cabecera{text-align:center;padding:22px 0 18px}
.marca{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--papel-suave);font-weight:600}
.placa{
  display:inline-block;margin-top:12px;background:var(--papel);color:#16302C;
  font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:34px;letter-spacing:.06em;
  padding:8px 22px;border-radius:3px;
  box-shadow:inset 0 -2px 0 rgba(0,0,0,.22),0 2px 6px rgba(0,0,0,.45);
}
.contenido{font-size:14.5px;color:var(--papel-suave);margin-top:12px;min-height:22px}
.contenido b{color:var(--papel);font-weight:600}

/* ---------- Los cuatro dígitos ---------- */
.digitos{display:flex;gap:11px;justify-content:center;margin:6px 0 4px}
.digito{
  width:58px;height:70px;border:1.5px solid var(--linea);border-radius:6px;
  background:#0E2724;display:grid;place-items:center;
  font-family:'IBM Plex Mono',monospace;font-size:32px;font-weight:600;
  transition:border-color .15s, background .15s;
}
.digito[data-lleno="1"]{border-color:var(--ambar);background:#16332E}
.digito[data-activo="1"]{border-color:var(--papel-suave)}
/* cursor titilando en la casilla que toca */
.digito[data-activo="1"]::after{content:"";width:2px;height:30px;background:var(--papel-suave);
  animation:latir 1.1s steps(1) infinite}
@keyframes latir{50%{opacity:0}}
.mensaje{text-align:center;font-size:14px;min-height:46px;padding:10px 6px 0;color:var(--papel-suave)}
.mensaje[data-tipo="error"]{color:#F3A79F;font-weight:500}
.mensaje[data-tipo="ok"]{color:#7FD9AC}

/* ---------- Teclado ---------- */
.teclado{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:auto;padding-top:14px}
.tecla{
  height:64px;border:1px solid var(--linea);border-radius:6px;background:#173B37;
  color:var(--papel);font-family:'IBM Plex Mono',monospace;font-size:26px;font-weight:600;
  cursor:pointer;transition:background .1s,transform .06s;
}
.tecla:active{background:var(--esmalte-cl);transform:translateY(2px)}
.tecla.secundaria{font-family:'Archivo',sans-serif;font-size:15px;font-weight:600;
  background:none;color:var(--papel-suave)}
.tecla.abrir{background:var(--ambar);color:#20140A;border-color:var(--ambar-osc);
  font-family:'Archivo',sans-serif;font-size:16px;font-weight:800;box-shadow:0 3px 0 var(--ambar-osc)}
.tecla.abrir:active{box-shadow:0 1px 0 var(--ambar-osc)}
.tecla:disabled{opacity:.4;cursor:not-allowed;transform:none}

/* ---------- Resultado ---------- */
.pantalla{display:none;flex-direction:column;flex:1}
.pantalla[data-activa="1"]{display:flex}
.resultado{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:20px 10px}
.icono{width:110px;height:110px;border-radius:50%;display:grid;place-items:center;
  font-size:46px;font-weight:800;margin-bottom:24px}
.icono[data-estado="abriendo"]{background:var(--ambar);color:#20140A;
  animation:respirar 1.6s ease-in-out infinite}
.icono[data-estado="ok"]{background:var(--verde);color:#06301D}
.icono[data-estado="error"]{background:var(--alarma);color:#33100C}
@keyframes respirar{50%{transform:scale(.93)}}
.resultado h1{font-size:25px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.resultado p{font-size:15px;color:var(--papel-suave);margin-top:12px;max-width:30ch}
.detalle{background:rgba(255,255,255,.05);border:1px solid var(--linea);border-radius:6px;
  padding:14px 18px;margin-top:24px;font-size:14px;text-align:left;width:100%;max-width:320px}
.detalle div{display:flex;justify-content:space-between;gap:14px;padding:4px 0}
.detalle span:first-child{color:var(--papel-suave)}
.detalle span:last-child{font-weight:600;text-align:right}
.volver{margin-top:26px;background:none;border:1px solid var(--linea);color:var(--papel);
  font-family:inherit;font-size:15px;padding:13px 30px;border-radius:5px;cursor:pointer}
.pie{text-align:center;font-size:12px;color:#5B7F77;padding:16px 0 4px;line-height:1.6}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="hoja">

  <!-- ============ INGRESO DEL CÓDIGO ============ -->
  <section class="pantalla" id="pantallaCodigo" data-activa="1">
    <div class="cabecera">
      <div class="marca">Pañol UNRaf · Casillero</div>
      <div class="placa" id="placa">—</div>
      <div class="contenido" id="contenido">Cargando…</div>
    </div>

    <div class="digitos" id="digitos">
      <div class="digito" data-activo="1"></div>
      <div class="digito"></div>
      <div class="digito"></div>
      <div class="digito"></div>
    </div>
    <p class="mensaje" id="mensaje">Ingresá el código de 4 dígitos que te dio Alumnado.</p>

    <div class="teclado" id="teclado">
      <button class="tecla" data-t="1">1</button>
      <button class="tecla" data-t="2">2</button>
      <button class="tecla" data-t="3">3</button>
      <button class="tecla" data-t="4">4</button>
      <button class="tecla" data-t="5">5</button>
      <button class="tecla" data-t="6">6</button>
      <button class="tecla" data-t="7">7</button>
      <button class="tecla" data-t="8">8</button>
      <button class="tecla" data-t="9">9</button>
      <button class="tecla secundaria" data-t="borrar">Borrar</button>
      <button class="tecla" data-t="0">0</button>
      <button class="tecla abrir" data-t="abrir" id="btnAbrir" disabled>Abrir</button>
    </div>

    <p class="pie">¿Perdiste el código o se te venció?<br>Acercate a la Mesa de Alumnado.</p>
  </section>

  <!-- ============ RESULTADO ============ -->
  <section class="pantalla" id="pantallaResultado">
    <div class="resultado">
      <div class="icono" id="icono" data-estado="abriendo">↑</div>
      <h1 id="tituloResultado">Abriendo…</h1>
      <p id="textoResultado">La orden va camino al casillero.</p>
      <div class="detalle" id="detalle" hidden></div>
      <button class="volver" id="btnVolver" hidden>Listo</button>
    </div>
  </section>
</div>

<script>
/* ============================================================
   PÁGINA DEL QR
   El QR pegado en cada locker apunta acá con el casillero en la
   URL:  http://<servidor>:3000/abrir?casillero=A-01
   Esa parte es la que hace que un código sirva SOLO en su locker.
   ============================================================ */

const API = location.protocol.startsWith('http')
  ? location.origin + '/api'
  : 'http://localhost:3000/api';

// El casillero viene del QR. Si alguien entra a mano sin parámetro, se pide.
const CASILLERO = (new URLSearchParams(location.search).get('casillero') || '')
  .trim().toUpperCase();

const estado = { digitos: '', enviando: false };
const $ = (id) => document.getElementById(id);

/* ---------- Arranque ---------- */
(async function iniciar() {
  if (!CASILLERO) {
    $('placa').textContent = '?';
    mostrarMensaje('Escaneá el QR pegado en el casillero: esta página necesita saber cuál es.', 'error');
    $('teclado').style.opacity = '.35';
    $('teclado').style.pointerEvents = 'none';
    return;
  }

  $('placa').textContent = CASILLERO;
  try {
    const respuesta = await fetch(`${API}/publico/casillero/${CASILLERO}`);
    const datos = await respuesta.json();
    if (!respuesta.ok) throw new Error(datos.error);

    $('contenido').innerHTML = datos.item ? `Contiene <b>${datos.item}</b>` : 'Sin material cargado';

    if (datos.fueraDeServicio) {
      mostrarMensaje('Este casillero está fuera de servicio. Avisale a Alumnado.', 'error');
    } else if (datos.puertaAbierta) {
      mostrarMensaje('La puerta ya está abierta.', 'ok');
    }
  } catch (error) {
    $('contenido').textContent = 'No pude conectarme al servidor';
  }
})();

/* ---------- Teclado ---------- */
$('teclado').addEventListener('click', (e) => {
  const tecla = e.target.closest('.tecla');
  if (!tecla || estado.enviando) return;

  const valor = tecla.dataset.t;
  if (valor === 'borrar') estado.digitos = estado.digitos.slice(0, -1);
  else if (valor === 'abrir') { abrir(); return; }
  else if (estado.digitos.length < 4) estado.digitos += valor;

  dibujarDigitos();

  // Con los cuatro dígitos, abre solo: un toque menos parado en el pasillo.
  if (estado.digitos.length === 4) setTimeout(abrir, 150);
});

// Teclado físico, por si alguien entra desde una computadora
document.addEventListener('keydown', (e) => {
  if (estado.enviando) return;
  if (/^\d$/.test(e.key) && estado.digitos.length < 4) {
    estado.digitos += e.key;
    dibujarDigitos();
    if (estado.digitos.length === 4) setTimeout(abrir, 150);
  } else if (e.key === 'Backspace') {
    estado.digitos = estado.digitos.slice(0, -1);
    dibujarDigitos();
  } else if (e.key === 'Enter' && estado.digitos.length === 4) {
    abrir();
  }
});

function dibujarDigitos() {
  const casillas = $('digitos').children;
  for (let i = 0; i < 4; i++) {
    const lleno = i < estado.digitos.length;
    casillas[i].textContent = lleno ? '•' : '';
    casillas[i].dataset.lleno = lleno ? '1' : '0';
    casillas[i].dataset.activo = i === estado.digitos.length ? '1' : '0';
  }
  $('btnAbrir').disabled = estado.digitos.length !== 4;
}

function mostrarMensaje(texto, tipo) {
  $('mensaje').textContent = texto;
  if (tipo) $('mensaje').dataset.tipo = tipo;
  else $('mensaje').removeAttribute('data-tipo');
}

/* ---------- Apertura ---------- */
async function abrir() {
  if (estado.enviando || estado.digitos.length !== 4) return;
  estado.enviando = true;

  mostrarPantalla('pantallaResultado');
  ponerResultado('abriendo', '↑', 'Abriendo…', 'La orden va camino al casillero.');

  try {
    const respuesta = await fetch(`${API}/publico/abrir`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ casillero: CASILLERO, codigo: estado.digitos }),
    });
    const datos = await respuesta.json();
    if (!respuesta.ok) throw new Error(datos.error || 'No se pudo abrir');

    const esRetiro = datos.accion === 'RETIRO';
    ponerResultado(
      'ok', '✓',
      esRetiro ? 'Listo, retirá' : 'Listo, guardá',
      esRetiro
        ? 'El casillero se está abriendo. Sacá tu material y cerrá la puerta.'
        : 'El casillero se está abriendo. Guardá el material y cerrá la puerta.'
    );

    $('detalle').hidden = false;
    $('detalle').innerHTML = `
      <div><span>Material</span><span>${datos.cantidad} × ${datos.item}</span></div>
      <div><span>Casillero</span><span>${datos.casillero}</span></div>
      <div><span>Usos que quedan</span><span>${datos.usosRestantes}</span></div>`;

    if (datos.usosRestantes === 0) {
      $('textoResultado').textContent +=
        ' Este código ya no sirve más: el préstamo quedó cerrado.';
    } else {
      $('textoResultado').textContent +=
        ' Guardá el código: te queda un uso para devolver el material.';
    }
  } catch (error) {
    ponerResultado('error', '✕', 'No se pudo abrir', error.message);
  }

  $('btnVolver').hidden = false;
  estado.enviando = false;
}

function ponerResultado(estadoIcono, simbolo, titulo, texto) {
  $('icono').dataset.estado = estadoIcono;
  $('icono').textContent = simbolo;
  $('tituloResultado').textContent = titulo;
  $('textoResultado').textContent = texto;
  $('detalle').hidden = true;
  $('btnVolver').hidden = true;
}

const mostrarPantalla = (id) => {
  document.querySelectorAll('.pantalla').forEach((p) => (p.dataset.activa = '0'));
  $(id).dataset.activa = '1';
};

$('btnVolver').addEventListener('click', () => {
  estado.digitos = '';
  dibujarDigitos();
  mostrarMensaje('Ingresá el código de 4 dígitos que te dio Alumnado.');
  mostrarPantalla('pantallaCodigo');
});

dibujarDigitos();
</script>
</body>
</html>
